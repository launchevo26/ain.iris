<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris - AIN Cloud</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 500px; height: 85vh; background: #1e293b; display: flex; flex-direction: column; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; }
        .chat-header { background: #334155; padding: 14px; text-align: center; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #475569; display: flex; flex-direction: column; gap: 6px; }
        .chat-header input { background: #0f172a; border: 1px solid #475569; color: white; padding: 6px 10px; border-radius: 4px; font-size: 0.9rem; text-align: center; outline: none; }
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-break: break-word; }
        .user-message { background: #3b82f6; align-self: flex-end; color: white; }
        .iris-message { background: #475569; align-self: flex-start; color: #f8fafc; }
        .chat-input-area { display: flex; padding: 12px; background: #334155; border-top: 1px solid #475569; }
        .chat-input-area input { flex: 1; padding: 10px; border: none; border-radius: 6px; background: #1e293b; color: white; font-size: 1rem; outline: none; }
        .chat-input-area button { background: #3b82f6; color: white; border: none; padding: 0 16px; margin-left: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .chat-input-area button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <span>Iris (AIN Cloud)</span>
            <input type="text" id="usernameInput" placeholder="Enter your username (e.g. thomas)" value="thomas">
        </div>
        <div id="chatMessages" class="chat-messages">
            <div class="message iris-message">Hello. I'm Iris. Enter your username above and let me know how I can help you.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const inputField = document.getElementById("userInput");
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") sendMessage();
        });

        async function sendMessage() {
            const username = document.getElementById("usernameInput").value.trim();
            const text = inputField.value.trim();
            
            if (!username) {
                alert("Please enter a username first.");
                return;
            }
            if (!text) return;

            const chatMessages = document.getElementById("chatMessages");
            
            // Append user message
            chatMessages.innerHTML += `<div class="message user-message">${text}</div>`;
            inputField.value = "";
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // Send request matching the backend's expected JSON structure
                const response = await fetch("http://127.0.0.1:8000/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: username, message: text })
                });
                const data = await response.json();

                // Append Iris response
                chatMessages.innerHTML += `<div class="message iris-message">${data.reply}</div>`;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
                chatMessages.innerHTML += `<div class="message iris-message" style="color: #f87171;">Error connecting to Iris backend.</div>`;
            }
        }
    </script>
</body>
</html>
